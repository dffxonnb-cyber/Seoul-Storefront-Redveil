name: Refine hero headline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-hero-headline.yml"

permissions:
  contents: write

jobs:
  refine-hero-headline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update hero headline
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("app/site/index.html")
          text = index_path.read_text(encoding="utf-8")

          old = """      <h1>\n        서울 상가 매입 전,<br />\n        먼저 <span>위험 신호</span>를 확인합니다.\n      </h1>"""
          new = """      <h1>\n        서울 상가 매입 전,<br />\n        <span class=\"hero-highlight-line\">위험 신호부터</span><br />\n        확인합니다.\n      </h1>"""

          if old not in text:
              raise SystemExit("Expected hero headline block was not found.")

          index_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          css_path = Path("app/site/styles.css")
          css = css_path.read_text(encoding="utf-8")
          css_patch = """

/* Keep the Redveil hero emphasis as one readable phrase */
.product-hero-copy h1 {
  max-width: 9.8ch !important;
}

.product-hero-copy h1 .hero-highlight-line {
  display: inline-block;
  white-space: nowrap;
  color: #ff3347;
  text-shadow: 0 0 34px rgba(255, 30, 53, 0.34);
}
"""
          if "hero-highlight-line" not in css:
              css_path.write_text(css.rstrip() + css_patch, encoding="utf-8")

          Path(".github/workflows/refine-hero-headline.yml").unlink()
          PY

      - name: Commit refined headline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/site/index.html app/site/styles.css .github/workflows/refine-hero-headline.yml
          git commit -m "Refine Redveil hero headline flow"
          git push
