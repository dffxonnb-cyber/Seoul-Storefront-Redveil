name: Deploy Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Python tests
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" > python-test.log 2>&1
          status=$?
          cat python-test.log
          exit $status

      - name: Upload Python test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-failure-log
          path: python-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Build website payload
        run: python src/redveil/pipelines/export_website_payload.py

      - name: Prepare frontend assets
        run: |
          python scripts/prepare_frontend_assets.py
          python scripts/prepare_frontend_assets.py --check

      - name: Run client runtime check
        run: node scripts/check_client_runtime.mjs

      - name: Run site smoke check
        run: python scripts/check_site_smoke.py

      - name: Run Chromium end-to-end tests
        run: npx playwright test

      - name: Upload review hero preview
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'agent/redesign-review-hero'
        uses: actions/upload-artifact@v4
        with:
          name: review-hero-redesign-preview
          path: test-results/review-hero-redesign.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload compare district minimap preview
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'agent/compare-district-minimaps'
        uses: actions/upload-artifact@v4
        with:
          name: compare-district-minimap-preview
          path: test-results/compare-district-minimaps.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check generated site payload
        run: test -f app/site/website_payload.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build website payload
        run: python src/redveil/pipelines/export_website_payload.py

      - name: Prepare frontend assets
        run: |
          python scripts/prepare_frontend_assets.py
          python scripts/prepare_frontend_assets.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
