name: Deploy Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build website payload
        run: python src/redveil/pipelines/export_website_payload.py

      - name: Prepare frontend assets
        run: |
          python scripts/prepare_frontend_assets.py
          python scripts/prepare_frontend_assets.py --check

      - name: Run client runtime check
        run: node scripts/check_client_runtime.mjs

      - name: Run site smoke check
        run: python scripts/check_site_smoke.py

      - name: Run Chromium end-to-end tests
        run: npx playwright test

      - name: Upload README mobile screenshots
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'docs/readme-mobile-pair'
        uses: actions/upload-artifact@v4
        with:
          name: readme-mobile-pair
          path: |
            test-results/readme-mobile-map.png
            test-results/readme-mobile-report.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload review hero preview
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'agent/redesign-review-hero'
        uses: actions/upload-artifact@v4
        with:
          name: review-hero-redesign-preview
          path: test-results/review-hero-redesign.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload compare district minimap preview
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'agent/compare-district-minimaps'
        uses: actions/upload-artifact@v4
        with:
          name: compare-district-minimap-preview
          path: test-results/compare-district-minimaps.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check generated site payload
        run: test -f app/site/website_payload.js

      - name: Commit README mobile showcase
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'docs/readme-mobile-pair'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}" "+refs/heads/main:refs/remotes/origin/main"
          git checkout -B "${HEAD_BRANCH}" "origin/${HEAD_BRANCH}"
          mkdir -p docs/evidence
          cp test-results/readme-mobile-map.png docs/evidence/redveil-v2-readme-mobile-map-2026-07-13.png
          cp test-results/readme-mobile-report.png docs/evidence/redveil-v2-readme-mobile-report-2026-07-13.png
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = '''### 모바일 지원

          <p align="center">
            <img src="./docs/evidence/redveil-v2-readme-mobile-focus.png" alt="Redveil V2 모바일 지도 홈" width="430" />
          </p>

          <p align="center"><sub>모바일에서는 제품 소개와 지도 선택 흐름을 한 열로 재배치합니다.</sub></p>'''
          new = '''### 모바일 지원

          <table>
            <tr>
              <td width="50%"><img src="./docs/evidence/redveil-v2-readme-mobile-map-2026-07-13.png" alt="Redveil V2 모바일 서울 자치구 리스크 지도" /></td>
              <td width="50%"><img src="./docs/evidence/redveil-v2-readme-mobile-report-2026-07-13.png" alt="Redveil V2 모바일 구별 리포트와 결정 메모" /></td>
            </tr>
            <tr>
              <td align="center"><strong>지도 탐색</strong></td>
              <td align="center"><strong>구별 리포트·결정 메모</strong></td>
            </tr>
          </table>

          <p align="center"><sub>모바일에서도 자치구 선택부터 위험 사유 확인, 결정 메모까지 같은 흐름을 유지합니다.</sub></p>'''
          if old not in text:
              raise SystemExit("README mobile section marker was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git show origin/main:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          rm tests/e2e/readme-mobile-pair.spec.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/evidence/redveil-v2-readme-mobile-map-2026-07-13.png docs/evidence/redveil-v2-readme-mobile-report-2026-07-13.png .github/workflows/deploy-pages.yml tests/e2e/readme-mobile-pair.spec.mjs
          git commit -m "docs: refresh README mobile showcase"
          git push origin "HEAD:${HEAD_BRANCH}"

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build website payload
        run: python src/redveil/pipelines/export_website_payload.py

      - name: Prepare frontend assets
        run: |
          python scripts/prepare_frontend_assets.py
          python scripts/prepare_frontend_assets.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
